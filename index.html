<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuta Noguchi</title>
<style>
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --border: #ddd8d0;
    --text: #2b2b2b;
    --text-muted: #767267;
    --accent: #a35c3c;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 24px;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 4px;
  }
  .affiliation {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 32px;
  }
  section {
    margin-bottom: 32px;
  }
  h2 {
    font-size: 1rem;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  ul.links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  ul.links a {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
  }
  ul.links a:hover {
    border-color: var(--accent);
  }
  ul.links .desc {
    display: block;
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }
  .placeholder {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-style: italic;
  }
</style>
</head>
<body>
<main>
  <h1>野口 雄太 <span style="font-weight:400;color:var(--text-muted);">Yuta Noguchi</span></h1>
  <p class="affiliation">福岡大学 工学部 建築学科 助教</p>

  <section>
    <h2>Research Interests</h2>
    <p>建築計画、農村計画、災害復興（炭鉱集落を含む）</p>
  </section>

  <section>
    <h2>Links</h2>
    <ul class="links">
      <li>
        <a href="https://yutanoguchi051.github.io/ExLibris/">
          蔵書リスト（ExLibris）
          <span class="desc">重複購入の確認用、および関心分野の選書リストとして公開しています</span>
        </a>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
