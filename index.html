<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuta Noguchi</title>
<style>
  :root {
    --bg: #e9e9e7;
    --text: #333333;
    --text-muted: #8a8a86;
    --link: #4a5a72;
    --border: #cfcfca;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  a { color: var(--link); }

  .site-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 32px;
    max-width: 900px;
    margin: 0 auto;
  }
  .site-nav .brand {
    font-weight: 600;
    letter-spacing: 0.08em;
    font-size: 0.9rem;
    color: var(--text);
    text-decoration: none;
  }
  .site-nav .nav-links {
    display: flex;
    gap: 28px;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
  }
  .site-nav .nav-links a,
  .site-nav .nav-links span {
    text-decoration: none;
    color: var(--text-muted);
  }
  .site-nav .nav-links .current {
    color: var(--text);
  }

  main {
    max-width: 640px;
    margin: 40px auto 100px;
    padding: 0 24px;
    text-align: center;
  }

  .kicker {
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    margin-bottom: 40px;
  }

  .portrait {
    display: block;
    width: 100%;
    max-width: 252px;
    height: auto;
    border-radius: 3px;
    margin: 0 auto 32px;
    filter: grayscale(100%) brightness(1.15);
    transition: filter 0.4s ease;
  }
  .portrait:hover {
    filter: grayscale(0%);
  }

  .name-ja {
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    margin: 0;
  }
  .name-en {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin: 6px 0 32px;
  }

  .affiliation, .degree {
    font-size: 0.92rem;
    line-height: 1.9;
    margin: 0;
  }

  .keywords {
    margin-top: 28px;
    font-size: 0.88rem;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 44px auto;
    width: 60%;
  }

  ul.links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.85rem;
  }
  ul.links a {
    text-decoration: underline;
  }
  ul.links .desc {
    display: block;
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-top: 2px;
  }
</style>
</head>
<body>
<nav class="site-nav">
  <a class="brand" href="/">FU NOGUCHI LAB.</a>
  <div class="nav-links">
    <span class="current">PROFILE</span>
    <a href="https://yutanoguchi051.github.io/FU-NoguchiLab/">LAB</a>
    <a href="https://yutanoguchi051.github.io/ExLibris/">ExLibris</a>
  </div>
</nav>

<main>
  <p class="kicker">PROFILE</p>

  <img src="profile.jpg" alt="野口雄太" class="portrait">

  <p class="name-ja">野口 雄太</p>
  <p class="name-en">YUTA NOGUCHI</p>

  <p class="affiliation">
    福岡大学 工学部 建築学科 助教<br>
    Assistant Professor,<br>
    Faculty of Engineering, Department of Architecture,<br>
    Fukuoka University
  </p>
  <p class="degree">博士（工学） / Dr. Eng.</p>

  <p class="keywords">建築計画・農村計画</p>

  <hr>

  <ul class="links">
    <li>
      <a href="https://researchmap.jp/ynoguchi">https://researchmap.jp/ynoguchi</a>
    </li>
  </ul>
</main>
</body>
</html>
